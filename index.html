<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SURF Lending Dashboard</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://esm.sh https://cdn.jsdelivr.net https://surflending.org; connect-src 'self' https://tokens.cardano.org https://surflending.org https://esm.sh https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://esm.sh">
<link rel="preconnect" href="https://tokens.cardano.org">
<link rel="preconnect" href="https://surflending.org">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<header>
  <nav>
    <div class="nav-tabs">
      <button class="tab tab-active" data-view="positions">Positions</button>
      <button class="tab" data-view="analytics">Analytics</button>
      <button class="tab" data-view="pools">Pools</button>
      <button class="tab" data-view="activity">Activity</button>
      <button class="tab" data-view="surf">SURF</button>
    </div>
    <div class="nav-actions">
      <button class="btn btn-sm btn-ghost" id="themeBtn">☀</button>
      <div id="walletArea">
        <button class="btn btn-sm btn-primary" id="connectBtn">Connect Wallet</button>
      </div>
    </div>
  </nav>
</header>

<main class="container">

  <!-- Positions View -->
  <div id="positionsView">
    <div class="section-title">Positions</div>
    <div class="surf-filters">
      <input type="text" id="addrFilter" placeholder="Filter by address..." class="surf-input">
      <select id="poolFilter" class="surf-select">
        <option value="">All Pools</option>
      </select>
      <select id="statusFilter" class="surf-select">
        <option value="">All Status</option>
        <option value="active">Active</option>
        <option value="at_risk">At Risk</option>
      </select>
    </div>
    <div id="surfSummary" class="summary-section"></div>
    <div id="surfPoolApys" class="apy-section"></div>
    <div class="table-wrap" id="surfTableWrap"></div>
  </div>

  <!-- Analytics View -->
  <div id="analyticsView" style="display:none">
    <div class="section-title">Analytics</div>
    <div class="analytics-toolbar">
      <div class="time-range-group" id="timeRangeGroup">
        <button class="btn btn-sm range-btn" data-range="24h">24H</button>
        <button class="btn btn-sm range-btn active" data-range="7d">7D</button>
        <button class="btn btn-sm range-btn" data-range="30d">30D</button>
        <button class="btn btn-sm range-btn" data-range="all">All</button>
      </div>
      <div class="currency-toggle" id="currencyToggle">
        <button class="btn btn-sm curr-btn active" data-curr="usd">USD</button>
        <button class="btn btn-sm curr-btn" data-curr="ada">ADA</button>
      </div>
    </div>
    <div id="analyticsSummary" class="analytics-summary"></div>
    <div class="charts-grid" id="chartsGrid">
      <div class="chart-card"><canvas id="tvlChart"></canvas></div>
      <div class="chart-card"><canvas id="tvlCompChart"></canvas></div>
      <div class="chart-card"><canvas id="borrowSupplyChart"></canvas></div>
      <div class="chart-card"><canvas id="ltvAprChart"></canvas></div>
      <div class="chart-card"><canvas id="marketCompChart"></canvas></div>
      <div class="chart-card"><canvas id="revenueChart"></canvas></div>
      <div class="chart-card chart-card-wide" id="stakingChartCard"><canvas id="stakingChart"></canvas></div>
    </div>
  </div>

  <!-- Pools View -->
  <div id="poolsView" style="display:none">
    <div class="section-title">Pools</div>
    <div id="poolDeepDive" class="pool-grid"></div>
  </div>

  <!-- Activity View -->
  <div id="activityView" style="display:none">
    <div class="section-title">Activity</div>
    <div class="activity-filters">
      <select id="activityTypeFilter" class="surf-select">
        <option value="">All Types</option>
        <option value="Deposit">Deposit</option>
        <option value="Withdraw">Withdraw</option>
        <option value="Borrow">Borrow</option>
        <option value="Repay">Repay</option>
        <option value="Liquidate">Liquidate</option>
        <option value="Leveraged Borrow">Leveraged Borrow</option>
      </select>
      <input type="text" id="activityAddrFilter" placeholder="Filter by address..." class="surf-input">
    </div>
    <div id="activityList" class="activity-list"></div>
    <div class="pagination" id="activityPagination"></div>
  </div>

  <!-- SURF Token View -->
  <div id="surfView" style="display:none">
    <div class="section-title">SURF Token</div>
    <div id="surfTokenSummary" class="summary-section"></div>
    <div id="surfTokenDetails" class="token-details"></div>
    <div class="section-title" style="margin-top:1rem">Top Holders</div>
    <div class="table-wrap" id="holderTableWrap"></div>
    <div class="chart-card" style="margin-top:1rem"><canvas id="distChart"></canvas></div>
  </div>

</main>

<div class="modal-overlay" id="walletModal">
  <div class="modal">
    <button class="btn btn-sm btn-ghost modal-close" data-close="walletModal">&times;</button>
    <h2>Connect Wallet</h2>
    <div class="wallet-list" id="walletList"></div>
    <p class="tooltip">Make sure your Cardano wallet extension is installed and unlocked.</p>
  </div>
</div>

<footer class="footer">
  <a href="https://github.com/kvnhndrsn/surf-lending" target="_blank" rel="noopener" class="footer-link"><svg role="img" viewBox="0 0 24 24" class="footer-icon" xmlns="http://www.w3.org/2000/svg"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg> GitHub</a>
  <span class="footer-text">2026 open sourced under the MIT license.</span>
</footer>

<div class="toast" id="toast"></div>

<script type="importmap">
{
  "imports": {
    "bech32": "https://esm.sh/bech32@2.0.0"
  }
}
</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script type="module" src="/app.js" defer></script>
</body>
</html>
